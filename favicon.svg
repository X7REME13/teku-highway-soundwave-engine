<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Teku Electric Glow -->
    <filter id="teku-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="teku-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <linearGradient id="teku-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff4400" />
    </linearGradient>

    <linearGradient id="carbon-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>
  </defs>

  <!-- Carbon Shield Base Plate -->
  <polygon points="60,4 114,24 98,94 60,116 22,94 6,24" 
           fill="url(#carbon-plate)" 
           stroke="#00f0ff" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           opacity="0.95" />

  <!-- Inner Cyan Energy Border -->
  <polygon points="60,12 106,29 92,88 60,108 28,88 14,29" 
           fill="none" 
           stroke="#00f0ff" 
           stroke-width="1.2" 
           stroke-opacity="0.45" />

  <!-- Teku Soundwave Ridge Ribs (Left & Right) -->
  <g filter="url(#teku-glow)">
    <!-- Left Soundwave Bars -->
    <polygon points="26,38 38,36 34,44 24,46" fill="#00f0ff" opacity="0.85" />
    <polygon points="23,52 40,49 36,58 21,60" fill="url(#teku-orange-grad)" />
    <polygon points="22,66 38,64 34,72 20,74" fill="#00f0ff" opacity="0.85" />

    <!-- Right Soundwave Bars -->
    <polygon points="94,38 82,36 86,44 96,46" fill="#00f0ff" opacity="0.85" />
    <polygon points="97,52 80,49 84,58 99,60" fill="url(#teku-orange-grad)" />
    <polygon points="98,66 82,64 86,72 100,74" fill="#00f0ff" opacity="0.85" />
  </g>

  <!-- Stylized Iconic TEKU "T" Centerpiece -->
  <g filter="url(#teku-glow)">
    <!-- Upper Horizontal Wing Bar -->
    <polygon points="34,22 86,22 78,32 42,32" fill="url(#teku-cyan-grad)" />
    
    <!-- Center Dynamic Spear / Vertical Slash -->
    <polygon points="54,26 66,26 64,82 60,98 56,82" fill="url(#teku-cyan-grad)" />
    
    <!-- Inner Core Speed Highlights -->
    <polygon points="46,25 74,25 70,29 50,29" fill="#ffffff" opacity="0.9" />
    <polygon points="58,32 62,32 61,78 59,78" fill="#ffffff" opacity="0.9" />

    <!-- Teku Orange Slash Accent -->
    <polygon points="57,84 63,84 60,103" fill="#ff7700" />
  </g>
</svg>
